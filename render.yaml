services:
  - type: web
    name: messaging-system
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    #one worker only, the message batching lives in process memory
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BLOOIO_API_KEY
        sync: false
      - key: HIL_RECIPENT
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_VERIFY_TOKEN
        sync: false
      - key: MESSENGER_ACCESS_TOKEN
        sync: false
      - key: MESSENGER_VERIFY_TOKEN
        sync: false
      - key: DASHBOARD_URL
        sync: false
      - key: DASH_KEY
        sync: false
      - key: QUOTE_SECRET
        sync: false
      - key: BLOOIO_WEBHOOK_SECRET
        sync: false
      - key: IG_APP_SECRET
        sync: false
      - key: MESSENGER_APP_SECRET
        sync: false
