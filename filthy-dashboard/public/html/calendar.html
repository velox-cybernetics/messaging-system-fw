<!doctype html>
<html lang="en">
    <head>
        <!--META-->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#000000">
        <title>Calendar | Filthy Wraps</title>


        <!--STYLES-->
        <link rel="stylesheet" href="/css/base.css">
        <link rel="stylesheet" href="/css/calendar.css">


        <!--SCRIPTS-->
        <script type="module" src="/js/calendar.js"></script>
    </head>
    <body>
        <!--TOP BAR-->
        <header class="bar">
            <a class="brand" href="/"><img src="/img/logo.png" alt="Filthy Wraps" width="212" height="256"></a>
            <nav class="nav" aria-label="Pages">
                <a href="/"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-6M12 20V5M19 20v-9M3 20h18" /></svg>Overview</a>
                <a href="/messages"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5h15v11h-9l-6 4z" /></svg>Messages</a>
                <a href="/follow-ups" class="desktop-only"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" /></svg>Follow ups</a>
                <a href="/calendar" class="desktop-only" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="2" /><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4" /></svg>Calendar</a>
                <a href="/system" class="desktop-only"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" /></svg>System info</a>
            </nav>
            <button type="button" class="sign-out">Sign out</button>
        </header>


        <!--CALENDAR-->
        <main class="calendar desktop-page">
            <h1 class="wide">Calendar</h1>
            <div class="calendar-frame">
                <iframe src="https://calendar.google.com/calendar/embed?src=filthywraps%40gmail.com&amp;ctz=America%2FChicago" title="Booking calendar"></iframe>
            </div>
        </main>


        <!--PHONE NOTE-->
        <section class="soon desktop-note">
            <h1 class="wide">Calendar</h1>
            <p>This page only opens on a computer.</p>
        </section>
    </body>
</html>
